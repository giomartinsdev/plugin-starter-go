name = "contador"
display_name = "Contador"
version = "1.0.0"
description = "Plugin de exemplo em Go: conta quantas vezes cada membro usou o comando."
lang = "go"

capabilities = ["reply", "kv"]

[[commands]]
name = "contar"
description = "Conta mais um para você"

